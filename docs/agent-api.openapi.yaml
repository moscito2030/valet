openapi: 3.1.0
info:
  title: VALET agent API
  version: 0.1.0
paths:
  /api/agent/events/{eventId}/status:
    get:
      operationId: eventStatus
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current round, tables still missing a score, and published board numbers.
  /api/agent/events/{eventId}/preview:
    post:
      operationId: previewMutation
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, command]
              properties:
                requestId: { type: string }
                command: { type: object }
      responses:
        '200':
          description: What would change. Nothing is stored.
  /api/agent/events/{eventId}/mutations:
    post:
      operationId: applyMutation
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Applied once. The same key returns the first result.
        '403':
          description: Machine code CODE_REVOKED, CODE_EXPIRED, or FORBIDDEN_ROLE, plus the Chinese message.
        '409':
          description: Machine code REVISION_CONFLICT, plus the Chinese message.
