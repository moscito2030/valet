name: Verify Valet
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm audit
      - run: npm test
      - run: npm run build
      - run: npm run test:security
      - run: npx tsx scripts/empty-competition-smoke.ts
      - run: npm run typecheck
